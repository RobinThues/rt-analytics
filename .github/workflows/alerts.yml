name: Alerts

# Spec: docs/superpowers/specs/2026-10-31-launch-package-design.md, part 3. The repo is public, so these logs are too:
# the job prints only app and problem names, never numbers.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: alerts
  cancel-in-progress: false

permissions:
  id-token: write # keyless access to BigQuery
  contents: read

jobs:
  check:
    # Stays off until `npm run setup:gcp -- --alerts` has run and printed these variables.
    if: vars.ALERTS_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install the root tools only
        run: npm ci --workspaces=false --include-workspace-root --ignore-scripts

      # Pinned to a commit, because this step gets the cloud access. This is v3.0.0.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.ALERTS_WIF_PROVIDER }}
          service_account: ${{ vars.ALERTS_SERVICE_ACCOUNT }}

      # Secrets, not variables: GitHub prints variables in the step's env in the public log, and these hold an address.
      - name: Check the rules
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: |
          export LAST_COMMIT_AT="$(git log -1 --format=%cI)"
          npx tsx scripts/alerts/run.ts
